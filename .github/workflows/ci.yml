name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: savestock
          POSTGRES_USER: savestock
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U savestock -d savestock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.lock.txt ruff pip-audit
      - name: Check migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://savestock:ci-only-password@localhost:5432/savestock
        run: alembic upgrade head
      - run: ruff check --select E4,E7,E9,F app migrations tests
      - run: pytest -q
      - name: Test application against PostgreSQL
        env:
          SAVESTOCK_TEST_DATABASE_URL: postgresql+psycopg://savestock:ci-only-password@localhost:5432/savestock
        run: pytest -q
      - run: pip-audit -r requirements.lock.txt
